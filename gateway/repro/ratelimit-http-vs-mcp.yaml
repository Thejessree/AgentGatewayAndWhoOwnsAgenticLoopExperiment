# agentgateway v1.7.0: the same localRateLimit (2/min) on two routes.
#   /jaeger (plain HTTP)  -> 200 200 429 429 429 429
#   /mcp    (MCP backend) -> 200 200 200 200 200 200, but calls 3-6 are BLOCKED:
#       body = {"result":{"content":[{"text":"rate limit exceeded ..."}],"isError":true}}
#       and they never reach the server. Count 429s and you'll think the limit is off.
# Run: ./bin/agentgateway-bin -f gateway/repro/ratelimit-http-vs-mcp.yaml
#      (needs Jaeger on :16686 and the vulnerable server on :8181)
gateways:
  default:
    port: 3000
routes:
- matches:
  - path:
      pathPrefix: /jaeger
  backends:
  - host: 127.0.0.1:16686
  policies:
    urlRewrite:
      path:
        prefix: /
    localRateLimit:
    - maxTokens: 2
      tokensPerFill: 1
      fillInterval: 60s
      type: requests
- matches:
  - path:
      pathPrefix: /mcp
  backends:
  - mcp:
      statefulMode: stateless
      targets:
      - name: devops
        mcp:
          host: http://127.0.0.1:8181/mcp
  policies:
    localRateLimit:
    - maxTokens: 2
      tokensPerFill: 1
      fillInterval: 60s
      type: requests
config:
  session:
    # Auto-generated by agentgateway to encode session IDs. Changing it invalidates existing sessions.
    key: 8ecd524e253ea1ba15f3c6b7377e06f22a0aa321aeef828f02c511f39ba40b1b
